name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - run: npm run lint
      # Cobre api/ e supabase/functions/ — ambos ficavam fora do type-check
      # porque tsconfig.app.json só inclui src. O tsc de src/ vem no build.
      - run: npm run typecheck
      # Sintaxe das migrations, antes que cheguem no Postgres de algum cliente.
      - run: npm run validate:sql
      - run: npm run build
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: tests/.artifacts/
          retention-days: 7
